name: validate

on:
  push:
  pull_request:

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check forbidden committed .env
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real .env file is committed."
            exit 1
          fi
      - name: Basic YAML parse
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '.github/workflows' in str(p):
                  continue
              with p.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY
