name: validate

on:
  push:
  pull_request:

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: pip install -r requirements-ci.txt

      - name: Check forbidden committed .env
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real .env file is committed."
            exit 1
          fi

      - name: Basic YAML parse
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.').rglob('*.y*ml'):
              with p.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY

      - name: Core safety contract
        run: python scripts/validate-repository.py

      - name: Configuration and storage guard regressions
        shell: pwsh
        run: ./scripts/test-config.ps1

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          pwsh -File scripts/init-env.ps1
          pwsh -File scripts/render-config.ps1
          trap 'rm -f .env' EXIT
          docker compose config --quiet
