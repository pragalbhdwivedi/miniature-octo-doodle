name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: pip install -r requirements-ci.txt

      - name: Check forbidden committed .env
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real .env file is committed."
            exit 1
          fi

      - name: Basic YAML parse
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.').rglob('*.y*ml'):
              with p.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY

      - name: Core safety contract
        run: python scripts/validate-repository.py

      - name: Deterministic routing and budget regressions
        run: python -m unittest discover -s tests -v

      - name: Configuration and storage guard regressions
        shell: pwsh
        run: ./scripts/test-config.ps1

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          pwsh -File scripts/init-env.ps1
          pwsh -File scripts/render-config.ps1
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  source-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: repository-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package validated main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          archive="gatewayai-source-${GITHUB_SHA}.tar.gz"
          git archive --format=tar HEAD | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          (cd dist && sha256sum --check "$archive.sha256")

      - name: Publish source bundle for operator promotion
        uses: actions/upload-artifact@v4
        with:
          name: gatewayai-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
