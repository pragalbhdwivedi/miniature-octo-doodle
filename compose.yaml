# Bootstrap Compose skeleton.
# ChatGPT Work must verify current upstream image tags and configuration before first run.
# Default startup is intentionally core-only.

name: miniature-octo-doodle

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    networks: [core]
    # Work must add the validated LiteLLM command/config mount after checking current docs.

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    restart: unless-stopped
    depends_on:
      - litellm
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:8080"
    networks: [core]
    volumes:
      - open-webui-data:/app/backend/data
    # Work must configure Open WebUI to use LiteLLM as its OpenAI-compatible endpoint.

networks:
  core:

volumes:
  postgres-data:
  open-webui-data:
