name: miniature-octo-doodle

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Run scripts/manage.ps1 init}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  litellm:
    image: ${LITELLM_IMAGE:?Required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_TELEMETRY: "False"
      PYTHONPATH: /app/policy-code
      GATEWAY_MONTHLY_BUDGET_USD: ${GATEWAY_MONTHLY_BUDGET_USD:-0}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm/config.local.yaml:/app/config.yaml:ro
      - ./gateway:/app/policy-code/gateway:ro
      - ./config/policy/policy.local.json:/app/policy.json:ro
      - policy-data:/app/policy-data
    ports:
      - "127.0.0.1:4000:4000"
    networks: [database, core]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 90s
      retries: 12
    logging: *logging

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:?Required}
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${WEBUI_GATEWAY_KEY:-unprovisioned}
      ENABLE_OPENAI_API: "True"
      ENABLE_OLLAMA_API: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      ENABLE_DIRECT_INTEGRATIONS: "False"
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_PERSISTENT_CONFIG: "False"
      # Native mode injects WebUI builtin tools even in an ordinary chat.
      # No tools are configured; the gateway separately denies tool definitions.
      DEFAULT_MODEL_PARAMS: '{"function_calling":"legacy"}'
      ENABLE_SIGNUP: "False"
      WEBUI_AUTH: "True"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Required}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?Required}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Required}
      WEBUI_URL: http://127.0.0.1:3000
      OFFLINE_MODE: "True"
      HF_HUB_OFFLINE: "1"
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "False"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "False"
      WHISPER_MODEL_AUTO_UPDATE: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    ports:
      - "127.0.0.1:3000:8080"
    networks: [core]
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 90s
      retries: 12
    logging: *logging

networks:
  database:
    internal: true
  core:

volumes:
  postgres-data:
  open-webui-data:
  policy-data:
